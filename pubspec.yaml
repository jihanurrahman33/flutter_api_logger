name: flutter_api_logger
description: Secure API request & response logger for http and dio. Masks tokens and passwords, silent in release builds, optional cURL output. Pure Dart.
version: 1.1.0
homepage: https://github.com/jihanurrahman33/flutter_api_logger
repository: https://github.com/jihanurrahman33/flutter_api_logger
issue_tracker: https://github.com/jihanurrahman33/flutter_api_logger/issues
topics:
  - logging
  - http
  - dio
  - networking

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  dio: ">=5.3.0 <6.0.0"
  http: ">=1.1.0 <2.0.0"

dev_dependencies:
  lints: ">=3.0.0 <7.0.0"
  test: ">=1.24.0 <2.0.0"
